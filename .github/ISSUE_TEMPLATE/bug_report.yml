name: 问题反馈
description: 报告音频、曲谱、界面或数据保存问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        请提供能复现问题的最小步骤。此处内容公开，请不要提交密码、令牌、私人录音或无权公开的曲谱。
        使用说明：https://github.com/Ruoyu-Tianyi/singing-key-practice/blob/main/docs/USER_GUIDE.md
  - type: dropdown
    id: area
    attributes:
      label: 出现问题的位置
      options:
        - 麦克风与音高识别
        - 播放与曲谱练习
        - 收音设置与自动校准
        - 曲谱导入与编辑
        - 练习记录与数据保存
        - 页面布局与操作
        - 其他
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: 使用地址或版本
      description: 例如生产网址、GitHub Pages，或本地提交编号；不要填写含令牌的地址。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望结果与实际结果
      description: 如果有错误提示，请复制原文。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 设备与浏览器
      description: 设备型号、系统版本、浏览器及版本；音频问题补充耳机/麦克风、是否蓝牙、是否发生过切后台或锁屏。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选）
      description: 可从应用帮助复制，检查内容后再粘贴。不要附账号凭据或私人数据。
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: 截图或最小样本（可选）
      description: 曲谱问题可附有权公开的最小文件或简谱片段，说明文件格式和期望音符。
